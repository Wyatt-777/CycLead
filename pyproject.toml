[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cyclelead-ai"
version = "0.1.0"
description = "Evidence-first bicycle-industry lead discovery MVP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.110,<1",
  "httpx>=0.27,<1",
  "lxml>=5.2,<6",
  "phonenumbers>=8.13,<10",
  "pydantic-settings>=2.2,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.4,<1",
]

[project.scripts]
cyclelead = "app.cli:main"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools.packages.find]
include = ["app*"]
